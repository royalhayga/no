name: Stage 5 - Mihomo Real Outbound 204 Verification

on:
  workflow_run:
    workflows: ["Stage 4 - Socket TCP/TLS/QUIC Handshake Probe"]
    types:
      - completed
  workflow_dispatch:      # Manual trigger

jobs:
  stage5-verified:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Mihomo (Clash Meta) Binary
        run: |
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v1.18.0/mihomo-linux-amd64-v1.18.0.gz
          gunzip mihomo-linux-amd64-v1.18.0.gz
          chmod +x mihomo-linux-amd64-v1.18.0
          sudo mv mihomo-linux-amd64-v1.18.0 /usr/local/bin/mihomo

      - name: Run Stage 5 Mihomo 204 Verification
        run: python scripts/verified.py

      - name: Commit and Push Final Stage 5 & Production Output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Stage 5] Mihomo real 204 outbound verification completed & subscriptions synced"
            git push origin HEAD:master || git push origin HEAD:main || echo "Push skipped"
          fi
