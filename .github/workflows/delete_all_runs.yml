name: Delete All Old Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: 纯 curl + GitHub API 一键清空所有历史运行记录
        run: |
          RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[] | select(.id != '${{ github.run_id }}') | .id')
          for id in $RUNS; do
            echo "正在删除历史运行记录 ID: $id ..."
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id"
          done
          echo "✅ 所有历史记录已全部清空！"
