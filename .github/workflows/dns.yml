name: Index 3 - 三 DNS 墙检测 (DNS Check)

on:
  workflow_run:
    workflows: ["Index 2 - 指纹去重 (Dedupe)"]
    types:
      - completed
  workflow_dispatch:      # Manual trigger

jobs:
  index3-dns:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Index 3 Multi-DNS Filter
        run: python scripts/dns.py

      - name: Commit and Push Index 3 Output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/dns/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Index 3] Multi-DNS GFW pollution filter completed"
            git push origin HEAD:master || echo "Push skipped"
          fi
