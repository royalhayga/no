name: Stage 3 - Multi-DNS Health & GFW Pollution Filter

on:
  workflow_run:
    workflows: ["Stage 2 - Fingerprint Deduplication & Alias Analysis"]
    types:
      - completed
  workflow_dispatch:      # Manual trigger

jobs:
  stage3-dns:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Stage 3 Multi-DNS Filter
        run: python scripts/dns.py

      - name: Commit and Push Stage 3 Output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/dns/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Stage 3] Multi-DNS GFW pollution filter completed"
            git push origin HEAD:master || git push origin HEAD:main || echo "Push skipped"
          fi
