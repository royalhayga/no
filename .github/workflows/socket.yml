name: Index 4 - Socket 端口探针 (Socket Probe)

on:
  workflow_run:
    workflows: ["Index 3 - 三 DNS 墙检测 (DNS Check)"]
    types:
      - completed
  workflow_dispatch:      # Manual trigger

jobs:
  index4-socket:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Index 4 Socket Probe
        run: python scripts/socket.py

      - name: Commit and Push Index 4 Output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/socket/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Index 4] Socket TCP/TLS/QUIC probe completed"
            git push origin HEAD:master || echo "Push skipped"
          fi
