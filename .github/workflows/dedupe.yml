name: Index 2 - 指纹去重 (Dedupe)

on:
  workflow_run:
    workflows: ["Index 1 - 全量汇总 (Aggregate)"]
    types:
      - completed
  workflow_dispatch:      # Manual trigger

jobs:
  index2-dedupe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Index 2 Deduplication
        run: python scripts/dedupe.py

      - name: Commit and Push Index 2 Output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/deduped/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Index 2] SHA256 fingerprint deduplication & alias report completed"
            git push origin HEAD:master || echo "Push skipped"
          fi
