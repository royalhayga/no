name: Index 1 - 全量汇总 (Aggregate)

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Manual trigger

jobs:
  index1-aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Index 1 Aggregation
        run: python scripts/aggregate.py

      - name: Commit and Push Index 1 Output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/raw/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Index 1] Multi-source raw nodes aggregated"
            git push origin HEAD:master || echo "Push skipped"
          fi
