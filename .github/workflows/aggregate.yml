name: Index Pipeline - 全阶段处理 (Index 1-2-3-4-5-6-Template)

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Manual trigger

env:
  PYTHONUNBUFFERED: "1"   # Real-time unbuffered log output

jobs:
  pipeline:
    name: 全流程处理 (Index 1-6 + 模版引擎)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 安装 Mihomo (Clash Meta) 内核
        run: |
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v1.18.0/mihomo-linux-amd64-v1.18.0.gz
          gunzip mihomo-linux-amd64-v1.18.0.gz
          chmod +x mihomo-linux-amd64-v1.18.0
          sudo mv mihomo-linux-amd64-v1.18.0 /usr/local/bin/mihomo

      - name: Stage 0 - 克隆/同步所有 28 个参考仓库
        run: python scripts/clone_repos.py

      - name: Index 1 - 全量汇总 (Aggregate)
        run: python scripts/aggregate.py

      - name: Index 2 - 指纹去重 (Dedupe)
        run: python scripts/dedupe.py

      - name: Index 3 - 三 DNS 墙检测 (DNS Check)
        run: python scripts/dns_check.py

      - name: Index 4 - Socket 端口探针 (Socket Probe)
        run: python scripts/socket_probe.py

      - name: Index 5 - Mihomo 204 实测 (HTTP 204 Verified)
        run: python scripts/verified.py

      - name: Index 6 - GeoIP 精准按国家/地区划分导出 (By Country)
        run: python scripts/country_split.py

      - name: 动态 Clash 模版合成与双层负载均衡 (Template Engine)
        run: python scripts/template_engine.py

      - name: Mihomo 内核严苛语法与节点合法性校验 (Kernel Auditor & Auto Prune)
        run: python scripts/validate_and_prune.py

      - name: 提交并推送生产订阅结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Auto Pipeline] All stages 1-6 + template engine completed & output synced"
            git push origin HEAD:master || echo "Push skipped"
          fi
