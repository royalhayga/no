name: Index Pipeline - 全阶段 32 线程极速并发处理流水线

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Manual trigger

env:
  PYTHONUNBUFFERED: "1"   # Real-time unbuffered log output

jobs:
  pipeline:
    name: 全流程 32 线程极速并发流水线
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 安装 Mihomo (Clash Meta) 内核
        run: |
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v1.18.0/mihomo-linux-amd64-v1.18.0.gz
          gunzip mihomo-linux-amd64-v1.18.0.gz
          chmod +x mihomo-linux-amd64-v1.18.0
          sudo mv mihomo-linux-amd64-v1.18.0 /usr/local/bin/mihomo

      - name: 运行 32 线程极速并发流水线 (Pipeline Parallel Engine)
        run: python scripts/pipeline_parallel.py

      - name: Mihomo 内核严苛语法与节点合法性校验 (Kernel Auditor & Auto Prune)
        run: python scripts/validate_and_prune.py

      - name: 提交并推送生产订阅结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Auto Parallel Pipeline] All stages 0-6 completed & output synced"
            git push origin HEAD:master || echo "Push skipped"
          fi
