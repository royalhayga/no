name: Stage 1 - Multi-Source Local Aggregation

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:      # Manual trigger

jobs:
  stage1-aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Stage 1 Aggregation
        run: python scripts/aggregate.py

      - name: Commit and Push Stage 1 Output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/raw/
          if ! git diff --cached --quiet; then
            git commit -m "chore: [Stage 1] Multi-source raw nodes aggregated"
            git push origin HEAD:master || git push origin HEAD:main || echo "Push skipped"
          fi
