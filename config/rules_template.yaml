# ==================== 3. 严格分流规则 (由上至下匹配，顺序绝对固定) ====================
rules:
  # ================= 阶层 1：订阅更新服务器、自建节点服务器 IP 与本地保留网络（必须首位防死循环） =================
  - DOMAIN,umail.eu.org,DIRECT
  - IP-CIDR,45.159.51.56/32,DIRECT,no-resolve
  - IP-CIDR,104.243.24.216/32,DIRECT,no-resolve
  - IP-CIDR,104.225.233.178/32,DIRECT,no-resolve
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - RULE-SET,lancidr,DIRECT,no-resolve

  # ================= 阶层 2：国内影视（TVBox 采集站直连源，高于任何代理组，开播秒播） =================
  - RULE-SET,tvbox_cn,📺 国内影视
  - RULE-SET,tvbox_cn_ip,📺 国内影视,no-resolve

  # ================= 阶层 3：广告拦截（必须在业务规则之前拦截） =================
  - RULE-SET,reject,🛑 广告拦截

