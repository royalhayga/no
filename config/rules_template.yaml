mixed-port: 7890
allow-lan: true
mode: rule
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8    
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://doh.pub/dns-query

log-level: info
ipv6: false
external-controller: 0.0.0.0:9090

# 模版顶级私有节点占位符
proxies:
  - name: "手机"
    type: ss
    server: 1.1.1.1
    port: 8388
    cipher: aes-256-gcm
    password: "private_placeholder"
  - name: "reality funo"
    type: ss
    server: 1.1.1.1
    port: 8388
    cipher: aes-256-gcm
    password: "private_placeholder"
  - name: "JPreality"
