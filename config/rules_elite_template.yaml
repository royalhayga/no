# ==================== 1. 精简 Elite 策略组定义 ====================
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "手机"
      - "reality funo"
      - "JPreality"
      - "39515"
      - "reality"
      - "tourism"
      - "test"
      - DIRECT
      - REJECT

  # 广告拦截
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - PROXY

  # 核心高频业务策略组 (含 Pinterest 与 Vimeo)
