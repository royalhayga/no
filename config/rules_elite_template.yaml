# ==================== 1. 精简 Elite 策略组定义 ====================
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "手机"
      - "reality funo"
      - "JPreality"
      - "39515"
      - "reality"
      - "tourism"
      - "test"
      - DIRECT
      - REJECT

  # TVBox 直连与代理
  - name: 📺 国内影视
    type: select
    proxies:
      - DIRECT
      - PROXY
      - "手机"
      - REJECT

  - name: 📺 TVBox代理
    type: select
    proxies:
      - PROXY
      - "手机"
      - DIRECT
      - REJECT

  # 广告拦截
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - PROXY

  # 核心高频业务策略组 (精简版剔除冷门小众品牌)
